<!-- Mojo Project -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>健體紀錄與猛健樂追蹤</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css?v=80966">
</head>
<body>

<header>
  <h1>個人健體與猛健樂管理</h1>
</header>

<div class="nav-tabs">
  <button id="btnTabInbody" class="tab-btn active" type="button">📊 體態與猛健樂</button>
  <button id="btnTabDiet" class="tab-btn" type="button">🥗 飲食與運動</button>
</div>

<div class="container">
  
  <!-- 全站統一系統與雲端管理工具列 -->
  <div class="card" style="padding: 10px 16px; background: #e0f2fe; border: 1px solid #bae6fd; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
    <span style="font-size: 0.85rem; color: #0369a1; font-weight: 600;">☁️ 系統與雲端管理</span>
    <div style="display: flex; gap: 6px;">
      <button class="btn-sync" type="button" onclick="syncFromCloud()">從雲端載入</button>
      <button class="btn-sync" type="button" style="background:#8b5cf6;" onclick="openKeyModal()">⚙️ API Key</button>
      <button class="btn-sync" type="button" style="background:#64748b;" onclick="setupSecretToken()">雲端金鑰</button>
    </div>
  </div>
  
  <!-- 體態與猛健樂 TAB -->
  <div id="tab-inbody" class="tab-content active">
    
    <!-- 猛健樂施打紀錄 -->
    <div class="card" style="border-left: 5px solid var(--shot);">
      <div class="card-title">
        <span>💉 猛健樂 (Mounjaro) 施打紀錄</span>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>施打日期</label>
          <input type="date" id="shotDate">
        </div>
        <div class="form-group">
          <label>劑量 (mg)</label>
          <select id="shotDose">
            <option value="2.5mg">2.5 mg</option>
            <option value="5.0mg">5.0 mg</option>
            <option value="7.5mg">7.5 mg</option>
            <option value="10.0mg">10.0 mg</option>
            <option value="12.5mg">12.5 mg</option>
            <option value="15.0mg">15.0 mg</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>備註 / 施打部位</label>
        <input type="text" id="shotNote" placeholder="例：肚臍右側、食慾控制佳">
      </div>
      <button class="btn btn-shot-submit" type="button" onclick="saveShot()">記錄本次施打</button>
    </div>

    <!-- 家用體脂計品牌分流切換按鈕 -->
    <div style="display: flex; gap: 8px; margin-bottom: 12px;">
      <button id="btnBrandZepp" type="button" class="btn" style="flex: 1; padding: 10px; font-weight: bold; background: #0284c7; color: #fff; border-radius: 8px;" onclick="switchScaleBrand('zepp')">
        📱 Zepp Life 家用秤
      </button>
      <button id="btnBrandFitdays" type="button" class="btn" style="flex: 1; padding: 10px; font-weight: bold; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; border-radius: 8px;" onclick="switchScaleBrand('fitdays')">
        🟦 Fitdays 家用秤 (含骨骼肌)
      </button>
    </div>

    <!-- [品牌A] Zepp Life 區塊 (保留原本架構不動) -->
    <div id="zeppScaleBlock">
      <div class="card" style="border-left: 5px solid #0284c7;">
        <div class="card-title">
          <span>📱 家用體重計日常記錄 (Zepp Life)</span>
        </div>
        <label for="scaleImage" class="btn-upload" style="border-color: #0284c7; color: #0284c7; background: #f0f9ff;">
          📷 點擊此處上傳 Zepp Life 截圖（AI 自動辨識）
        </label>
        <input type="file" id="scaleImage" accept="image/*" style="display: none;" onchange="previewAndAnalyzeScale(this)">
        <img id="scaleImagePreview" class="preview-box">
        <button id="scaleAiBtn" class="btn btn-scale" type="button" style="display: none; margin-bottom: 12px;" onclick="analyzeScaleImage()">✨ 開始 AI 辨識 Zepp Life 數據</button>

        <div class="grid-2">
          <div class="form-group"><label>測量日期</label><input type="date" id="scaleDate"></div>
          <div class="form-group"><label>測量時間 (支援單日多次)</label><input type="time" id="scaleTime"></div>
        </div>
        <div class="grid-3">
          <div class="form-group"><label>體重 (kg) *</label><input type="number" step="0.01" id="scaleWeight" placeholder="例：81.35"></div>
          <div class="form-group"><label>肌肉 (kg)</label><input type="number" step="0.01" id="scaleMuscle" placeholder="例：57.22"></div>
          <div class="form-group"><label>體脂 (%)</label><input type="number" step="0.1" id="scaleFat" placeholder="例：25.8"></div>
        </div>
        <div class="grid-3">
          <div class="form-group"><label>BMI</label><input type="number" step="0.1" id="scaleBMI" placeholder="例：26.3"></div>
          <div class="form-group"><label>水分 (%)</label><input type="number" step="0.1" id="scaleWater" placeholder="例：50.8"></div>
          <div class="form-group"><label>內臟脂肪</label><input type="number" id="scaleVFL" placeholder="例：12"></div>
        </div>
        <div class="grid-3">
          <div class="form-group"><label>基礎代謝 (kcal)</label><input type="number" id="scaleBMR" placeholder="例：1622"></div>
          <div class="form-group"><label>骨質 (kg)</label><input type="number" step="0.01" id="scaleBone" placeholder="例：3.07"></div>
          <div class="form-group"><label>蛋白質 (%)</label><input type="number" step="0.1" id="scaleProtein" placeholder="例：19.4"></div>
        </div>
        <div class="grid-2" style="margin-bottom: 8px;">
          <div class="form-group"><label>身體評分</label><input type="number" id="scaleScore" placeholder="例：58"></div>
          <div class="form-group"><label>體型判定</label><input type="text" id="scaleBodyType" placeholder="例：偏胖型"></div>
        </div>
        <button class="btn btn-scale" type="button" onclick="saveScaleData()">記錄家用體重數據</button>
      </div>

      <div class="card">
        <div class="card-title">📈 家用日常趨勢 (Zepp Life)</div>
        <div class="chart-tabs" id="scaleChartTabs">
          <button class="chart-tab-btn active" type="button" onclick="switchScaleChartMode('core', this)">核心體態 (雙軸)</button>
          <button class="chart-tab-btn" type="button" onclick="switchScaleChartMode('water_bmr', this)">水分與代謝</button>
          <button class="chart-tab-btn" type="button" onclick="switchScaleChartMode('bone_protein', this)">骨質與蛋白質</button>
          <button class="chart-tab-btn" type="button" onclick="switchScaleChartMode('vfl_score', this)">內臟脂肪與評分</button>
        </div>
        <div class="chart-scroll-wrapper">
          <div id="scaleChartContainer" class="chart-scroll-inner"><canvas id="scaleChart"></canvas></div>
        </div>
      </div>

      <div class="card" style="background:#f8fafc; border: 1px solid #e2e8f0;">
        <div class="card-title">⚖️ InBody vs Zepp Life 偏差比對</div>
        <div id="scaleDiffReport" style="font-size:0.85rem; line-height: 1.6; color:#334155;">計算比對中...</div>
      </div>
    </div>

    <!-- [品牌B] Fitdays 區塊 (從外部 JS 自動注入，瘦身為空殼) -->
    <div id="fitdaysScaleContainer" style="display: none;"></div>

    <!-- InBody 全方位數據輸入 -->
    <div class="card">
      <div class="card-title"><span>📝 記錄 InBody 全方位數據</span></div>
      <label for="inbodyImage" class="btn-upload">📷 點擊此處拍照／上傳 InBody 報告照片</label>
      <input type="file" id="inbodyImage" accept="image/*" style="display: none;" onchange="previewAndAnalyzeInBody(this)">
      <img id="inbodyImagePreview" class="preview-box">
      <button id="inbodyAiBtn" class="btn btn-primary" type="button" style="display: none; margin-bottom: 15px;" onclick="analyzeInBodyImage()">✨ 開始 AI 辨識 InBody 數據</button>
      
      <div class="form-group"><label>測量日期</label><input type="date" id="bodyDate"></div>

      <!-- ... InBody 表單內容 ... -->
      <button class="btn btn-primary" type="button" onclick="saveBodyData()">儲存完整 InBody 數據</button>
    </div>

    <div class="card">
      <div class="card-title">📈 InBody 數據趨勢分析</div>
      <div class="chart-scroll-wrapper">
        <div id="bodyChartContainer" class="chart-scroll-inner"><canvas id="bodyChart"></canvas></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">💉 猛健樂施打歷程與週期回顧</div>
      <div id="shotLogList"></div>
    </div>

    <div class="card">
      <div class="card-title">📱 家用體重計歷史紀錄 (Zepp Life)</div>
      <div id="scaleLogList"></div>
      <div class="pagination-box" id="scalePagination"></div>
    </div>

    <div class="card">
      <div class="card-title">📊 InBody 歷史體態紀錄</div>
      <div id="bodyLogList"></div>
    </div>
  </div>

  <!-- 飲食與運動 TAB -->
  <div id="tab-diet" class="tab-content">
    <div class="card" style="padding: 12px 16px; background: #ffffff;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
        <button class="action-btn btn-edit" type="button" onclick="changeDietDateBy(-1)">◀ 前一天</button>
        <div style="flex: 1; text-align: center;">
          <input type="date" id="dietDate" style="text-align: center; font-weight: bold; border-color: var(--primary);" onchange="renderDiet()">
        </div>
        <button class="action-btn btn-edit" type="button" onclick="changeDietDateBy(1)">後一天 ▶</button>
        <button class="action-btn btn-sync" type="button" onclick="resetDietDateToToday()">今天</button>
      </div>
    </div>
    <!-- ... 省略其餘 Diet 卡片結構 ... -->
  </div>

  <div class="version-footer">版本驗證代碼：<strong>MK-80966</strong></div>
</div>

<script src="sync.js?v=80966"></script>
<script src="shot.js?v=80966"></script>
<script src="scale.js?v=80966"></script>
<script src="fitdays.js?v=80966"></script>
<script src="body.js?v=80966"></script>
<script src="body-chart.js?v=80966"></script>
<script src="diet.js?v=80966"></script>
<script src="main.js?v=80966"></script>
</body>
</html>
