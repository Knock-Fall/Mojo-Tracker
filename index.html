<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健體紀錄與猛健樂追蹤</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --primary: #3b82f6;
    --accent: #10b981;
    --shot: #ec4899;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --sub: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
  
  header { background: #0f172a; color: #fff; padding: 18px 20px; text-align: center; }
  header h1 { font-size: 1.2rem; }
  
  .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .tab-btn { flex: 1; padding: 12px 0; border: none; background: none; font-size: 0.95rem; font-weight: bold; color: var(--sub); cursor: pointer; }
  .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
  
  .container { padding: 16px; max-width: 600px; margin: 0 auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .card-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
  
  .form-group { margin-bottom: 12px; min-width: 0; }
  label { display: block; font-size: 0.85rem; color: var(--sub); margin-bottom: 4px; }
  
  input, select, textarea {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-size: 0.95rem;
    outline: none;
    -webkit-appearance: none;
    background-color: #fff;
    display: block;
  }
  select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    padding-right: 32px;
  }
  input:focus, select:focus { border-color: var(--primary); }
  
  .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; }
  .btn-shot { background: var(--shot); }
  .btn-ai { background: #8b5cf6; margin-top: 6px; }
  .btn-ai:disabled { background: #cbd5e1; cursor: not-allowed; }
  .btn-sync { background: #0284c7; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; color: #fff; border: none; cursor: pointer; }
  
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  
  /* InBody 模組分組樣式 */
  .section-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    background: #f8fafc;
  }
  .section-subtitle {
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--primary);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
  }
  .segment-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    padding: 8px;
    border-radius: 8px;
    text-align: center;
  }
  .segment-card h4 {
    font-size: 0.8rem;
    color: var(--text);
    margin-bottom: 4px;
  }
  .segment-card input {
    padding: 6px 4px;
    font-size: 0.85rem;
    margin-top: 4px;
    text-align: center;
  }

  .log-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  .log-item:last-child { border-bottom: none; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
  .badge-shot { background: #fdf2f8; color: var(--shot); }
  
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stat-box { background: #f1f5f9; padding: 10px 4px; border-radius: 10px; }
  .stat-box .num { font-size: 1.15rem; font-weight: bold; color: var(--primary); }
  .stat-box .txt { font-size: 0.75rem; color: var(--sub); margin-top: 2px; }

  .preview-box { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; margin-top: 8px; display: none; }
  .api-tip { font-size: 0.8rem; color: #8b5cf6; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>個人健體與猛健樂管理</h1>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" onclick="switchTab('inbody')">📊 體態與猛健樂</button>
  <button class="tab-btn" onclick="switchTab('diet')">🥗 飲食紀錄</button>
</div>

<div class="container">
  
  <!-- 雲端試算表同步狀態條 -->
  <div class="card" style="padding: 10px 16px; background: #e0f2fe; border: 1px solid #bae6fd; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 0.85rem; color: #0369a1;">☁️ Google 試算表同步已就緒</span>
    <div>
      <button class="btn-sync" onclick="syncFromCloud()">從雲端載入</button>
      <button class="btn-sync" style="background:#64748b;" onclick="setupSecretToken()">設定金鑰</button>
    </div>
  </div>
  
  <!-- 體態與猛健樂 TAB -->
  <div id="tab-inbody" class="tab-content active">
    
    <!-- 猛健樂 施打打卡 -->
    <div class="card" style="border-left: 5px solid var(--shot);">
      <div class="card-title">
        <span>💉 猛健樂 (Mounjaro) 施打紀錄</span>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>施打日期</label>
          <input type="date" id="shotDate">
        </div>
        <div class="form-group">
          <label>劑量 (mg)</label>
          <select id="shotDose">
            <option value="2.5mg">2.5 mg</option>
            <option value="5.0mg">5.0 mg</option>
            <option value="7.5mg">7.5 mg</option>
            <option value="10.0mg">10.0 mg</option>
            <option value="12.5mg">12.5 mg</option>
            <option value="15.0mg">15.0 mg</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>備註 / 施打部位</label>
        <input type="text" id="shotNote" placeholder="例：肚臍右側、食慾控制佳">
      </div>
      <button class="btn btn-shot" onclick="saveShot()">記錄本次施打</button>
    </div>

    <!-- InBody / 五大身體組成分析輸入區 -->
    <div class="card">
      <div class="card-title">📝 記錄 InBody 全方位數據</div>
      
      <div class="form-group">
        <label>測量日期</label>
        <input type="date" id="bodyDate">
      </div>

      <!-- 1. 身體組成分析 -->
      <div class="section-box">
        <div class="section-subtitle">1. 身體組成分析</div>
        <div class="grid-2">
          <div class="form-group">
            <label>總體重 (kg) *</label>
            <input type="number" step="0.1" id="bodyWeight" placeholder="必填">
          </div>
          <div class="form-group">
            <label>身體總水分 (L/kg)</label>
            <input type="number" step="0.1" id="bodyTBW" placeholder="0.0">
          </div>
          <div class="form-group">
            <label>蛋白質 (kg)</label>
            <input type="number" step="0.1" id="bodyProtein" placeholder="0.0">
          </div>
          <div class="form-group">
            <label>礦物質 (kg)</label>
            <input type="number" step="0.1" id="bodyMinerals" placeholder="0.0">
          </div>
        </div>
      </div>

      <!-- 2. 肌肉脂肪分析 -->
      <div class="section-box">
        <div class="section-subtitle">2. 肌肉脂肪分析</div>
        <div class="grid-2">
          <div class="form-group">
            <label>骨骼肌重 SMM (kg)</label>
            <input type="number" step="0.1" id="bodySMM" placeholder="0.0">
          </div>
          <div class="form-group">
            <label>體脂肪重 BFM (kg)</label>
            <input type="number" step="0.1" id="bodyBFM" placeholder="0.0">
          </div>
        </div>
      </div>

      <!-- 3. 肥胖分析 -->
      <div class="section-box">
        <div class="section-subtitle">3. 肥胖分析</div>
        <div class="grid-2">
          <div class="form-group">
            <label>BMI (kg/m²)</label>
            <input type="number" step="0.1" id="bodyBMI" placeholder="0.0">
          </div>
          <div class="form-group">
            <label>體脂肪率 PBF (%)</label>
            <input type="number" step="0.1" id="bodyPBF" placeholder="0.0">
          </div>
          <div class="form-group">
            <label>腰臀圍比 (WHR)</label>
            <input type="number" step="0.01" id="bodyWHR" placeholder="0.00">
          </div>
          <div class="form-group">
            <label>內臟脂肪等級</label>
            <input type="number" id="bodyVFL" placeholder="0">
          </div>
        </div>
      </div>

      <!-- 4. 部位肌肉分析 (kg / %) -->
      <div class="section-box">
        <div class="section-subtitle">4. 部位肌肉分析 (重量 kg / 比例 %)</div>
        <div class="grid-3" style="margin-bottom: 8px;">
          <div class="segment-card">
            <h4>右上肢</h4>
            <input type="number" step="0.01" id="m_ra_kg" placeholder="kg">
            <input type="number" step="0.1" id="m_ra_pct" placeholder="%">
          </div>
          <div class="segment-card">
            <h4>軀幹</h4>
            <input type="number" step="0.01" id="m_tr_kg" placeholder="kg">
            <input type="number" step="0.1" id="m_tr_pct" placeholder="%">
          </div>
          <div class="segment-card">
            <h4>左上肢</h4>
            <input type="number" step="0.01" id="m_la_kg" placeholder="kg">
            <input type="number" step="0.1" id="m_la_pct" placeholder="%">
          </div>
        </div>
        <div class="grid-2">
          <div class="segment-card">
            <h4>右下肢</h4>
            <input type="number" step="0.01" id="m_rl_kg" placeholder="kg">
            <input type="number" step="0.1" id="m_rl_pct" placeholder="%">
          </div>
          <div class="segment-card">
            <h4>左下肢</h4>
            <input type="number" step="0.01" id="m_ll_kg" placeholder="kg">
            <input type="number" step="0.1" id="m_ll_pct" placeholder="%">
          </div>
        </div>
      </div>

      <!-- 5. 部位脂肪分析 (kg / %) -->
      <div class="section-box">
        <div class="section-subtitle">5. 部位脂肪分析 (重量 kg / 比例 %)</div>
        <div class="grid-3" style="margin-bottom: 8px;">
          <div class="segment-card">
            <h4>右上肢</h4>
            <input type="number" step="0.01" id="f_ra_kg" placeholder="kg">
            <input type="number" step="0.1" id="f_ra_pct" placeholder="%">
          </div>
          <div class="segment-card">
            <h4>軀幹</h4>
            <input type="number" step="0.01" id="f_tr_kg" placeholder="kg">
            <input type="number" step="0.1" id="f_tr_pct" placeholder="%">
          </div>
          <div class="segment-card">
            <h4>左上肢</h4>
            <input type="number" step="0.01" id="f_la_kg" placeholder="kg">
            <input type="number" step="0.1" id="f_la_pct" placeholder="%">
          </div>
        </div>
        <div class="grid-2">
          <div class="segment-card">
            <h4>右下肢</h4>
            <input type="number" step="0.01" id="f_rl_kg" placeholder="kg">
            <input type="number" step="0.1" id="f_rl_pct" placeholder="%">
          </div>
          <div class="segment-card">
            <h4>左下肢</h4>
            <input type="number" step="0.01" id="f_ll_kg" placeholder="kg">
            <input type="number" step="0.1" id="f_ll_pct" placeholder="%">
          </div>
        </div>
      </div>

      <button class="btn" onclick="saveBodyData()">儲存完整 InBody 數據</button>
    </div>

    <!-- 趨勢圖表 -->
    <div class="card">
      <div class="card-title">📈 體重、骨骼肌與體脂趨勢</div>
      <canvas id="bodyChart" height="200"></canvas>
    </div>

    <!-- 歷史清單 -->
    <div class="card">
      <div class="card-title">📋 歷史體態與施打紀錄</div>
      <div id="bodyLogList"></div>
    </div>
  </div>

  <!-- 飲食紀錄 TAB -->
  <div id="tab-diet" class="tab-content">
    
    <!-- 今日摘要 -->
    <div class="card">
      <div class="card-title">
        <span>⚡ 今日營養累計</span>
        <span class="api-tip" onclick="setupApiKey()">⚙️ 設定 AI API Key</span>
      </div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="num" id="todayCal">0</div>
          <div class="txt">熱量 (kcal)</div>
        </div>
        <div class="stat-box">
          <div class="num" id="todayPro" style="color: #10b981;">0g</div>
          <div class="txt">蛋白質</div>
        </div>
        <div class="stat-box">
          <div class="num" id="targetCal">1500</div>
          <div class="txt">目標熱量</div>
        </div>
      </div>
    </div>

    <!-- 記錄餐點 & 拍照/相簿估算 -->
    <div class="card">
      <div class="card-title">🍽️ 新增餐點紀錄</div>
      
      <!-- AI 拍照/圖庫上傳區塊 -->
      <div class="form-group" style="background: #faf5ff; padding: 12px; border-radius: 12px; border: 1px dashed #c084fc; margin-bottom: 15px;">
        <label style="color: #7e22ce; font-weight: bold;">📸 拍照 / 從相簿選取照片 AI 自動估算</label>
        <input type="file" id="foodImage" accept="image/*" onchange="previewAndAnalyze(this)">
        <img id="imagePreview" class="preview-box">
        <button id="aiBtn" class="btn btn-ai" style="display: none;" onclick="analyzeFoodImage()">✨ 開始 AI 分析熱量與蛋白質</button>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>餐別</label>
          <select id="dietType">
            <option value="早餐">早餐</option>
            <option value="午餐">午餐</option>
            <option value="晚餐">晚餐</option>
            <option value="點心/補充">點心/補充</option>
          </select>
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="dietDate">
        </div>
      </div>
      <div class="form-group">
        <label>食物內容</label>
        <input type="text" id="dietContent" placeholder="例：雞胸肉沙拉、無糖豆漿">
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>熱量 (kcal)</label>
          <input type="number" id="dietCal" placeholder="0">
        </div>
        <div class="form-group">
          <label>蛋白質 (g)</label>
          <input type="number" step="0.1" id="dietPro" placeholder="0.0">
        </div>
      </div>
      <button class="btn" style="background: var(--accent);" onclick="saveDiet()">加入今日飲食</button>
    </div>

    <!-- 今日餐點清單 -->
    <div class="card">
      <div class="card-title">📖 當日飲食明細</div>
      <div id="dietLogList"></div>
    </div>
  </div>

</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycby_BMulRlvZ2MBdqsLNbYnn1lYm2o7fegy8J8ONiiu4sxIupy2sq_YYo21-KAJlVaW3cw/exec";

  const todayStr = new Date().toISOString().split('T')[0];
  document.getElementById('shotDate').value = todayStr;
  document.getElementById('bodyDate').value = todayStr;
  document.getElementById('dietDate').value = todayStr;

  let bodyLogs = JSON.parse(localStorage.getItem('my_body_logs') || '[]');
  let dietLogs = JSON.parse(localStorage.getItem('my_diet_logs') || '[]');
  let shotLogs = JSON.parse(localStorage.getItem('my_shot_logs') || '[]');

  function getSecretToken() {
    return localStorage.getItem('gas_secret_token') || 'my_custom_secret_key_888';
  }

  function setupSecretToken() {
    const current = getSecretToken();
    const token = prompt('請輸入您的試算表密鑰 (Secret Token)：', current);
    if (token !== null) {
      localStorage.setItem('gas_secret_token', token.trim());
      alert('密鑰已儲存！');
    }
  }

  function uploadToCloud(type, payload) {
    const token = getSecretToken();
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, type: type, payload: payload })
    }).catch(err => console.log('Cloud sync pending:', err));
  }

  async function syncFromCloud() {
    const token = getSecretToken();
    try {
      const res = await fetch(`${GAS_URL}?token=${encodeURIComponent(token)}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error || '驗證失敗');

      let newBody = [], newDiet = [], newShot = [];
      data.rows.forEach(r => {
        const type = r[1];
        try {
          const payload = JSON.parse(r[2]);
          if (type === 'BODY') newBody.push(payload);
          else if (type === 'DIET') newDiet.push(payload);
          else if (type === 'SHOT') newShot.push(payload);
        } catch(e){}
      });

      if (newBody.length || newDiet.length || newShot.length) {
        bodyLogs = newBody;
        dietLogs = newDiet;
        shotLogs = newShot;
        localStorage.setItem('my_body_logs', JSON.stringify(bodyLogs));
        localStorage.setItem('my_diet_logs', JSON.stringify(dietLogs));
        localStorage.setItem('my_shot_logs', JSON.stringify(shotLogs));
        renderBodyChart();
        renderBodyList();
        renderDiet();
        alert('✅ 已成功從 Google 試算表載入最新資料！');
      } else {
        alert('雲端試算表目前尚無資料。');
      }
    } catch(err) {
      alert('同步失敗：' + err.message + '\n請確認 Secret Token 是否與 Apps Script 一致。');
    }
  }

  function setupApiKey() {
    const currentKey = localStorage.getItem('gemini_api_key') || '';
    const key = prompt('請輸入您的 Google Gemini API Key（金鑰僅存在您的手機本地）：', currentKey);
    if (key !== null) {
      localStorage.setItem('gemini_api_key', key.trim());
      alert(key ? 'API Key 設定成功！' : '已清除 API Key');
    }
  }

  let base64Image = '';
  function previewAndAnalyze(input) {
    const file = input.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
        base64Image = e.target.result.split(',')[1];
        document.getElementById('aiBtn').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  async function analyzeFoodImage() {
    let apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      apiKey = prompt('首次使用拍照估算，請輸入您的 Gemini API Key：');
      if (!apiKey) return alert('未輸入 API Key，無法進行分析');
      localStorage.setItem('gemini_api_key', apiKey.trim());
    }

    const aiBtn = document.getElementById('aiBtn');
    aiBtn.disabled = true;
    aiBtn.innerText = '⏳ AI 分析估算中，請稍候...';

    const promptText = "請辨識此照片中的食物，以繁體中文簡要列出食物名稱，並預估其總熱量(kcal)與總蛋白質(g)。請務必且嚴格僅回傳如下純 JSON 格式，不要加入額外 markdown 標籤或文字：{\"food\": \"食物名稱摘要\", \"cal\": 450, \"pro\": 25.5}";

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inlineData: { mimeType: "image/jpeg", data: base64Image } }
            ]
          }]
        })
      });

      const resData = await response.json();
      if (resData.error) throw new Error(resData.error.message);

      let rawText = resData.candidates[0].content.parts[0].text.trim();
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);

      document.getElementById('dietContent').value = result.food || '';
      document.getElementById('dietCal').value = result.cal || '';
      document.getElementById('dietPro').value = result.pro || '';
      alert('✨ AI 估算完成！已自動填入食物名稱、熱量與蛋白質，請確認後按「加入今日飲食」。');
    } catch (err) {
      alert('分析失敗：' + err.message + '\n請確認 API Key 是否正確或網路狀態。');
    } finally {
      aiBtn.disabled = false;
      aiBtn.innerText = '✨ 開始 AI 分析熱量與蛋白質';
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if(tab === 'inbody') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-inbody').classList.add('active');
      renderBodyChart();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-diet').classList.add('active');
      renderDiet();
    }
  }

  function saveShot() {
    const shot = {
      date: document.getElementById('shotDate').value,
      dose: document.getElementById('shotDose').value,
      note: document.getElementById('shotNote').value
    };
    shotLogs.unshift(shot);
    localStorage.setItem('my_shot_logs', JSON.stringify(shotLogs));
    uploadToCloud('SHOT', shot);
    alert('猛健樂紀錄已儲存並同步至試算表！');
    renderBodyList();
  }

  function saveBodyData() {
    const weightVal = parseFloat(document.getElementById('bodyWeight').value);
    if (!weightVal) return alert('請至少輸入「總體重」數值！');

    const b = {
      date: document.getElementById('bodyDate').value,
      // 1. 身體組成
      weight: weightVal,
      tbw: parseFloat(document.getElementById('bodyTBW').value) || 0,
      protein: parseFloat(document.getElementById('bodyProtein').value) || 0,
      minerals: parseFloat(document.getElementById('bodyMinerals').value) || 0,
      // 2. 肌肉脂肪
      smm: parseFloat(document.getElementById('bodySMM').value) || 0,
      bfm: parseFloat(document.getElementById('bodyBFM').value) || 0,
      // 3. 肥胖分析
      bmi: parseFloat(document.getElementById('bodyBMI').value) || 0,
      pbf: parseFloat(document.getElementById('bodyPBF').value) || 0,
      whr: parseFloat(document.getElementById('bodyWHR').value) || 0,
      vfl: parseInt(document.getElementById('bodyVFL').value) || 0,
      // 4. 部位肌肉
      m_ra_kg: parseFloat(document.getElementById('m_ra_kg').value) || 0,
      m_ra_pct: parseFloat(document.getElementById('m_ra_pct').value) || 0,
      m_la_kg: parseFloat(document.getElementById('m_la_kg').value) || 0,
      m_la_pct: parseFloat(document.getElementById('m_la_pct').value) || 0,
      m_tr_kg: parseFloat(document.getElementById('m_tr_kg').value) || 0,
      m_tr_pct: parseFloat(document.getElementById('m_tr_pct').value) || 0,
      m_rl_kg: parseFloat(document.getElementById('m_rl_kg').value) || 0,
      m_rl_pct: parseFloat(document.getElementById('m_rl_pct').value) || 0,
      m_ll_kg: parseFloat(document.getElementById('m_ll_kg').value) || 0,
      m_ll_pct: parseFloat(document.getElementById('m_ll_pct').value) || 0,
      // 5. 部位脂肪
      f_ra_kg: parseFloat(document.getElementById('f_ra_kg').value) || 0,
      f_ra_pct: parseFloat(document.getElementById('f_ra_pct').value) || 0,
      f_la_kg: parseFloat(document.getElementById('f_la_kg').value) || 0,
      f_la_pct: parseFloat(document.getElementById('f_la_pct').value) || 0,
      f_tr_kg: parseFloat(document.getElementById('f_tr_kg').value) || 0,
      f_tr_pct: parseFloat(document.getElementById('f_tr_pct').value) || 0,
      f_rl_kg: parseFloat(document.getElementById('f_rl_kg').value) || 0,
      f_rl_pct: parseFloat(document.getElementById('f_rl_pct').value) || 0,
      f_ll_kg: parseFloat(document.getElementById('f_ll_kg').value) || 0,
      f_ll_pct: parseFloat(document.getElementById('f_ll_pct').value) || 0
    };

    bodyLogs.push(b);
    bodyLogs.sort((a,b) => new Date(a.date) - new Date(b.date));
    localStorage.setItem('my_body_logs', JSON.stringify(bodyLogs));
    uploadToCloud('BODY', b);
    alert('全方位 InBody 數據已儲存並同步至試算表！');
    renderBodyChart();
    renderBodyList();
  }

  function saveDiet() {
    const d = {
      date: document.getElementById('dietDate').value,
      type: document.getElementById('dietType').value,
      content: document.getElementById('dietContent').value,
      cal: parseInt(document.getElementById('dietCal').value) || 0,
      pro: parseFloat(document.getElementById('dietPro').value) || 0
    };
    if(!d.content) return alert('請輸入食物內容');
    dietLogs.unshift(d);
    localStorage.setItem('my_diet_logs', JSON.stringify(dietLogs));
    uploadToCloud('DIET', d);
    document.getElementById('dietContent').value = '';
    document.getElementById('dietCal').value = '';
    document.getElementById('dietPro').value = '';
    document.getElementById('foodImage').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('aiBtn').style.display = 'none';
    renderDiet();
    alert('餐點已記錄並同步至試算表！');
  }

  let chartInstance = null;
  function renderBodyChart() {
    const ctx = document.getElementById('bodyChart').getContext('2d');
    const labels = bodyLogs.map(l => l.date.slice(5));
    const weights = bodyLogs.map(l => l.weight);
    const pbfs = bodyLogs.map(l => l.pbf);
    const smms = bodyLogs.map(l => l.smm);

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: '體重 (kg)', data: weights, borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.2 },
          { label: '骨骼肌 (kg)', data: smms, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.2 },
          { label: '體脂率 (%)', data: pbfs, borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.2 }
        ]
      },
      options: { 
        responsive: true, 
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: false } }
      }
    });
  }

  function renderBodyList() {
    const container = document.getElementById('bodyLogList');
    let html = '';
    shotLogs.forEach(s => {
      html += `<div class="log-item">
        <div><strong>💉 猛健樂施打</strong> <small style="color:var(--sub)">${s.date}</small><br><small>${s.note || ''}</small></div>
        <span class="badge badge-shot">${s.dose}</span>
      </div>`;
    });
    bodyLogs.slice().reverse().forEach(b => {
      const trunkInfo = (b.m_tr_kg || b.f_tr_kg) ? ` ｜ 軀幹肌/脂: ${b.m_tr_kg || 0}/${b.f_tr_kg || 0}kg` : '';
      html += `<div class="log-item">
        <div>
          <strong>體重 ${b.weight} kg</strong> (體脂 ${b.pbf}%)<br>
          <small style="color:var(--sub)">${b.date} ｜ 肌肉 ${b.smm}kg ｜ 內臟 ${b.vfl}級${trunkInfo}</small>
        </div>
      </div>`;
    });
    container.innerHTML = html || '<p style="color:var(--sub);text-align:center;padding:10px;">尚未有體態或施打紀錄</p>';
  }

  function renderDiet() {
    const today = document.getElementById('dietDate').value;
    const list = document.getElementById('dietLogList');
    const todayItems = dietLogs.filter(d => d.date === today);
    
    let totalC = 0, totalP = 0, html = '';
    todayItems.forEach(item => {
      totalC += item.cal;
      totalP += item.pro;
      html += `<div class="log-item">
        <div><strong>[${item.type}] ${item.content}</strong></div>
        <div style="text-align:right;"><strong>${item.cal} kcal</strong><br><small style="color:var(--accent);">${item.pro}g 蛋白</small></div>
      </div>`;
    });

    document.getElementById('todayCal').innerText = totalC;
    document.getElementById('todayPro').innerText = totalP.toFixed(1) + 'g';
    list.innerHTML = html || '<p style="color:var(--sub);text-align:center;padding:10px;">今日尚無餐點紀錄</p>';
  }

  renderBodyChart();
  renderBodyList();
  renderDiet();
</script>
</body>
</html>
