<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>健康與體態全方位管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 頂部頁頭與分頁切換 -->
    <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-heart-pulse text-emerald-500"></i> 健康管理系統
        </h1>
        <p class="text-sm text-slate-500 mt-1">整合飲食營養、雙軌水分分析、猛健樂歷程與 InBody 數據</p>
      </div>
      <div class="flex border-b border-slate-200">
        <button type="button" id="tab-btn-diet" onclick="switchTab('diet')" class="px-5 py-2.5 text-sm tab-active transition">
          <i class="fa-solid fa-utensils mr-1.5"></i> 飲食與水分管理
        </button>
        <button type="button" id="tab-btn-body" onclick="switchTab('body')" class="px-5 py-2.5 text-sm text-slate-500 hover:text-slate-700 transition">
          <i class="fa-solid fa-chart-line mr-1.5"></i> 體態與猛健樂
        </button>
      </div>
    </header>

    <!-- 分頁一：飲食與水分管理 -->
    <main id="tab-diet" class="space-y-6">

      <!-- 水分雙軌打卡卡片 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-5">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
          <div>
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-droplet text-cyan-500"></i> 今日補水量追蹤（純水 + 無糖茶）
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">目標：2500 ml / 日</p>
          </div>
          <div class="text-2xl font-extrabold text-cyan-600">
            <span id="currentTotalWater">0</span> <span class="text-sm font-normal text-slate-500">/ 2500 ml</span>
          </div>
        </div>

        <div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden flex">
          <div id="pureProgressBar" class="bg-cyan-500 h-full transition-all duration-300" style="width: 0%"></div>
          <div id="teaProgressBar" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
          <div class="p-4 rounded-xl bg-cyan-50 border border-cyan-100 flex items-center justify-between">
            <div>
              <div class="text-xs font-semibold text-cyan-800 flex items-center gap-1.5">
                <i class="fa-solid fa-glass-water"></i> 純水攝取
              </div>
              <div class="text-xl font-bold text-cyan-900 mt-1">
                <span id="displayPureWater">0</span> <span class="text-xs font-normal">ml</span>
              </div>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="addWater('pure', 250)" class="px-3 py-1.5 bg-white text-cyan-700 text-xs font-semibold rounded-lg shadow-sm border border-cyan-200 hover:bg-cyan-100/50 transition">+250ml</button>
              <button type="button" onclick="addWater('pure', 500)" class="px-3 py-1.5 bg-cyan-600 text-white text-xs font-semibold rounded-lg shadow-sm hover:bg-cyan-700 transition">+500ml</button>
            </div>
          </div>

          <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-100 flex items-center justify-between">
            <div>
              <div class="text-xs font-semibold text-emerald-800 flex items-center gap-1.5">
                <i class="fa-solid fa-mug-hot"></i> 無糖茶類
              </div>
              <div class="text-xl font-bold text-emerald-900 mt-1">
                <span id="displayTeaWater">0</span> <span class="text-xs font-normal">ml</span>
              </div>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="addWater('tea', 350)" class="px-3 py-1.5 bg-white text-emerald-700 text-xs font-semibold rounded-lg shadow-sm border border-emerald-200 hover:bg-emerald-100/50 transition">+350ml</button>
              <button type="button" onclick="addWater('tea', 700)" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-semibold rounded-lg shadow-sm hover:bg-emerald-700 transition">+700ml</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 飲食輸入與 AI 解析區 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> AI 飲食與水分智慧辨識
        </h2>
        
        <textarea id="aiInput" rows="3" class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none transition resize-none text-slate-700" placeholder="輸入今日飲食，例如：午餐吃雞胸肉便當，喝了 500ml 純水與 700ml 無糖綠茶"></textarea>

        <div class="flex justify-end">
          <button type="button" id="aiBtn" onclick="runAiAnalysis()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
            <span>AI 自動解析並填入</span>
            <i class="fa-solid fa-bolt text-sm"></i>
          </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-6 gap-3 pt-3 border-t border-slate-100">
          <div>
            <label class="text-xs font-medium text-slate-500">熱量 (kcal)</label>
            <input type="number" id="inputCalories" class="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800" value="0">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">蛋白質 (g)</label>
            <input type="number" id="inputProtein" class="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800" value="0">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">脂肪 (g)</label>
            <input type="number" id="inputFat" class="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800" value="0">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">碳水 (g)</label>
            <input type="number" id="inputCarbs" class="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800" value="0">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">纖維 (g)</label>
            <input type="number" id="inputFiber" class="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-800" value="0">
          </div>
          <div>
            <label class="text-xs font-medium text-slate-500">解析補水 (ml)</label>
            <input type="number" id="inputWater" class="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-cyan-600" value="0" readonly>
          </div>
        </div>
      </section>

    </main>

    <!-- 分頁二：體態與猛健樂歷程 -->
    <main id="tab-body" class="space-y-6 hidden">
      
      <!-- 卡片一：猛健樂施打歷程 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-syringe text-indigo-500"></i> 💉 猛健樂 (Mounjaro) 施打歷程
          </h2>
          <span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-medium">獨立歷程記錄</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
          <div>
            <label class="text-xs text-slate-500">施打日期</label>
            <input type="date" id="injDate" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm">
          </div>
          <div>
            <label class="text-xs text-slate-500">劑量 (mg)</label>
            <select id="injDose" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm">
              <option value="2.5">2.5 mg</option>
              <option value="5.0">5.0 mg</option>
              <option value="7.5">7.5 mg</option>
              <option value="10.0">10.0 mg</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-500">施打部位</label>
            <select id="injSite" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm">
              <option value="腹部左側">腹部左側</option>
              <option value="腹部右側">腹部右側</option>
              <option value="手臂">手臂</option>
              <option value="大腿">大腿</option>
            </select>
          </div>
          <div class="flex items-end">
            <button type="button" onclick="addInjectionRecord()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2 rounded-lg text-sm transition">
              記錄施打
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-400 text-xs">
              <tr>
                <th class="p-3">日期</th>
                <th class="p-3">劑量</th>
                <th class="p-3">施打部位</th>
                <th class="p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="injList" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- 卡片二：InBody 歷史體態數據 -->
      <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-simple text-emerald-500"></i> 📊 InBody 歷史體態數據
          </h2>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full font-medium">獨立體態記錄</span>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
          <div>
            <label class="text-xs text-slate-500">量測日期</label>
            <input type="date" id="inbodyDate" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm">
          </div>
          <div>
            <label class="text-xs text-slate-500">體重 (kg)</label>
            <input type="number" step="0.1" id="inbodyWeight" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm" placeholder="70.5">
          </div>
          <div>
            <label class="text-xs text-slate-500">骨骼肌重 (kg)</label>
            <input type="number" step="0.1" id="inbodySmm" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm" placeholder="32.1">
          </div>
          <div>
            <label class="text-xs text-slate-500">體脂肪率 (%)</label>
            <input type="number" step="0.1" id="inbodyBfp" class="w-full mt-1 p-2 bg-white border border-slate-200 rounded-lg text-sm" placeholder="21.0">
          </div>
          <div class="flex items-end col-span-2 md:col-span-1">
            <button type="button" onclick="addInbodyRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium p-2 rounded-lg text-sm transition">
              儲存數據
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-400 text-xs">
              <tr>
                <th class="p-3">量測日期</th>
                <th class="p-3">體重 (kg)</th>
                <th class="p-3">骨骼肌 (kg)</th>
                <th class="p-3">體脂率 (%)</th>
                <th class="p-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="inbodyList" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <!-- 依序載入模組檔案 -->
  <script src="common.js"></script>
  <script src="diet.js"></script>
  <script src="body.js"></script>
  <script src="app.js"></script>
</body>
</html>
